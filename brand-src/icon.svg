<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- Original artwork for this project: a simplified front view of a
       half-rack ADI-2 style converter (power button, two headphone jacks,
       big volume knob, button column, display, two encoders) receiving
       infrared waves from an IR LED below it. No logos or text.
       BODY/DETAIL are replaced per theme by make_brand.py; only the IR is red. -->

  <!-- Chassis and feet -->
  <rect x="10" y="44" width="236" height="64" rx="9" fill="BODY"/>
  <rect x="24" y="104" width="24" height="9" rx="3" fill="BODY"/>
  <rect x="208" y="104" width="24" height="9" rx="3" fill="BODY"/>

  <!-- Power button -->
  <circle cx="30" cy="78" r="8" fill="none" stroke="DETAIL" stroke-width="3.5"/>

  <!-- Headphone jacks -->
  <g fill="none" stroke="DETAIL" stroke-width="3.5">
    <circle cx="58" cy="82" r="6"/>
    <circle cx="80" cy="82" r="6"/>
  </g>

  <!-- Big volume knob -->
  <circle cx="118" cy="76" r="19" fill="none" stroke="DETAIL" stroke-width="6"/>

  <!-- Button column -->
  <g fill="DETAIL">
    <rect x="148" y="53" width="12" height="7" rx="2"/>
    <rect x="148" y="65" width="12" height="7" rx="2"/>
    <rect x="148" y="77" width="12" height="7" rx="2"/>
    <rect x="148" y="89" width="12" height="7" rx="2"/>
  </g>

  <!-- Display -->
  <rect x="168" y="54" width="46" height="44" rx="3" fill="DETAIL"/>

  <!-- Two encoders -->
  <g fill="none" stroke="DETAIL" stroke-width="3.5">
    <circle cx="230" cy="63" r="7"/>
    <circle cx="230" cy="89" r="7"/>
  </g>

  <!-- IR LED below, waves rising into the unit (stronger on arrival) -->
  <circle cx="128" cy="212" r="8" fill="#E11D48"/>
  <g fill="none" stroke="#E11D48" stroke-linecap="round" stroke-width="11">
    <path d="M108.7 189 A30 30 0 0 1 147.3 189" opacity="0.45"/>
    <path d="M92 169.1 A56 56 0 0 1 164 169.1" opacity="0.7"/>
    <path d="M75.3 149.2 A82 82 0 0 1 180.7 149.2"/>
  </g>
</svg>
